---
# Green Flag Automation - Kubernetes Secrets Template
#
# IMPORTANT: This is a TEMPLATE file. DO NOT commit actual secrets to git.
#
# To create secrets in your cluster:
# 1. Copy this file: cp secrets.yaml secrets-production.yaml
# 2. Replace all <PLACEHOLDER> values with actual base64-encoded secrets
# 3. Apply: kubectl apply -f secrets-production.yaml
# 4. Add secrets-production.yaml to .gitignore
#
# To base64 encode a value: echo -n "your-secret-value" | base64

apiVersion: v1
kind: Secret
metadata:
  name: green-flag-automation-secrets
  namespace: cassini
  labels:
    app: green-flag-automation
type: Opaque
data:
  # Database connection string
  # Format: postgresql://user:password@host:port/database
  # Example: postgresql://gfa_user:secretpass@rds-postgres.eu-west-1.rds.amazonaws.com:5432/green_flag_automation
  database-url: <BASE64_ENCODED_DATABASE_URL>

  # Redis connection string
  # Format: redis://host:port/db
  # Example: redis://elasticache-redis.abc123.0001.euw1.cache.amazonaws.com:6379/0
  redis-url: <BASE64_ENCODED_REDIS_URL>

  # Jira API credentials
  # Email: jira-bot@skyscanner.net
  jira-email: <BASE64_ENCODED_JIRA_EMAIL>

  # Jira API token from https://id.atlassian.com/manage-profile/security/api-tokens
  jira-api-token: <BASE64_ENCODED_JIRA_API_TOKEN>

  # Webhook secret (generate with: openssl rand -hex 32)
  jira-webhook-secret: <BASE64_ENCODED_WEBHOOK_SECRET>

  # Slack Bot Token (starts with xoxb-)
  # Get from https://api.slack.com/apps
  slack-bot-token: <BASE64_ENCODED_SLACK_BOT_TOKEN>

  # Slack Signing Secret
  slack-signing-secret: <BASE64_ENCODED_SLACK_SIGNING_SECRET>

  # Anthropic API Key (starts with sk-ant-)
  # Get from https://console.anthropic.com/settings/keys
  anthropic-api-key: <BASE64_ENCODED_ANTHROPIC_API_KEY>

  # OpenAI API Key (optional, starts with sk-)
  # Get from https://platform.openai.com/api-keys
  openai-api-key: <BASE64_ENCODED_OPENAI_API_KEY>

---
# Example commands to create secrets manually:
#
# kubectl create secret generic green-flag-automation-secrets \
#   --namespace=cassini \
#   --from-literal=database-url="postgresql://..." \
#   --from-literal=redis-url="redis://..." \
#   --from-literal=jira-email="jira-bot@skyscanner.net" \
#   --from-literal=jira-api-token="YOUR_JIRA_TOKEN" \
#   --from-literal=jira-webhook-secret="YOUR_WEBHOOK_SECRET" \
#   --from-literal=slack-bot-token="xoxb-YOUR-SLACK-TOKEN" \
#   --from-literal=slack-signing-secret="YOUR_SIGNING_SECRET" \
#   --from-literal=anthropic-api-key="sk-ant-YOUR-KEY" \
#   --from-literal=openai-api-key="sk-YOUR-OPENAI-KEY"
#
# Or using AWS Secrets Manager (recommended for production):
#
# kubectl create secret generic green-flag-automation-secrets \
#   --namespace=cassini \
#   --from-literal=database-url="$(aws secretsmanager get-secret-value --secret-id green-flag-automation/database-url --query SecretString --output text)" \
#   --from-literal=redis-url="$(aws secretsmanager get-secret-value --secret-id green-flag-automation/redis-url --query SecretString --output text)" \
#   ...
