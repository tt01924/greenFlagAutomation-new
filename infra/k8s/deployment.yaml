---
# Green Flag Automation - Kubernetes Deployment
# Deploys API server and worker pods with health checks and resource limits

apiVersion: apps/v1
kind: Deployment
metadata:
  name: green-flag-automation-api
  namespace: cassini
  labels:
    app: green-flag-automation
    component: api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: green-flag-automation
      component: api
  template:
    metadata:
      labels:
        app: green-flag-automation
        component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: green-flag-automation
      containers:
        - name: api
          image: skyscanner/green-flag-automation:latest
          imagePullPolicy: Always
          command: ["uvicorn"]
          args:
            - "src.main:app"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--workers"
            - "4"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            # Database
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: green-flag-automation-secrets
                  key: database-url
            # Redis
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: green-flag-automation-secrets
                  key: redis-url
            # Jira
            - name: JIRA_BASE_URL
              value: "https://skyscanner.atlassian.net"
            - name: JIRA_EMAIL
              valueFrom:
                secretKeyRef:
                  name: green-flag-automation-secrets
                  key: jira-email
            - name: JIRA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: green-flag-automation-secrets
                  key: jira-api-token
            - name: JIRA_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: green-flag-automation-secrets
                  key: jira-webhook-secret
            # Slack
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: green-flag-automation-secrets
                  key: slack-bot-token
            - name: SLACK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: green-flag-automation-secrets
                  key: slack-signing-secret
            # LLM APIs
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: green-flag-automation-secrets
                  key: anthropic-api-key
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: green-flag-automation-secrets
                  key: openai-api-key
                  optional: true
            # Application settings
            - name: ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "INFO"
            - name: DASHBOARD_URL
              value: "https://green-flag.cassini.skyscanner.net"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /app/src/config/canned_responses.yaml
              subPath: canned_responses.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: green-flag-automation-config

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: green-flag-automation-worker
  namespace: cassini
  labels:
    app: green-flag-automation
    component: worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: green-flag-automation
      component: worker
  template:
    metadata:
      labels:
        app: green-flag-automation
        component: worker
    spec:
      serviceAccountName: green-flag-automation
      containers:
        - name: worker
          image: skyscanner/green-flag-automation:latest
          imagePullPolicy: Always
          command: ["python"]
          args:
            - "-m"
            - "src.workers.ticket_processor_worker"
          env:
            # Same environment variables as API
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: green-flag-automation-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: green-flag-automation-secrets
                  key: redis-url
            - name: JIRA_BASE_URL
              value: "https://skyscanner.atlassian.net"
            - name: JIRA_EMAIL
              valueFrom:
                secretKeyRef:
                  name: green-flag-automation-secrets
                  key: jira-email
            - name: JIRA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: green-flag-automation-secrets
                  key: jira-api-token
            - name: JIRA_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: green-flag-automation-secrets
                  key: jira-webhook-secret
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: green-flag-automation-secrets
                  key: slack-bot-token
            - name: SLACK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: green-flag-automation-secrets
                  key: slack-signing-secret
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: green-flag-automation-secrets
                  key: anthropic-api-key
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: green-flag-automation-secrets
                  key: openai-api-key
                  optional: true
            - name: ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "INFO"
            - name: DASHBOARD_URL
              value: "https://green-flag.cassini.skyscanner.net"
          resources:
            requests:
              cpu: 1000m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /app/src/config/canned_responses.yaml
              subPath: canned_responses.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: green-flag-automation-config
