[tool.poetry]
name = "green-flag-automation"
version = "0.1.0"
description = "Green Flag Ticket Automation for Cassini Squad"
authors = ["Cassini Squad <cassini@skyscanner.net>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
sqlalchemy = "^2.0.25"
alembic = "^1.13.0"
psycopg2-binary = "^2.9.9"
redis = "^5.0.1"
rq = "^1.15.1"
anthropic = "^0.16.0"
openai = "^1.10.0"
atlassian-python-api = "^3.41.0"
slack-bolt = "^1.18.0"
pyyaml = "^6.0.1"
httpx = "^0.26.0"
prometheus-client = "^0.19.0"
python-multipart = "^0.0.6"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
bcrypt = "^4.1.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"
pytest-asyncio = "^0.23.3"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
black = "^24.1.0"
mypy = "^1.8.0"
pylint = "^3.0.3"
bandit = "^1.7.6"
httpx = "^0.26.0"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pylint.messages_control]
max-line-length = 100
disable = ["C0111", "C0103"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
