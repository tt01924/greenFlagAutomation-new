[pytest]
# Pytest configuration for Green Flag Automation

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum version
minversion = 7.0

# Add src to Python path
pythonpath = .

# Output options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --disable-warnings
    -ra

# Markers for test categorization
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (require database, Redis)
    contract: Contract tests (mock external APIs)
    e2e: End-to-end tests (full workflow)
    slow: Slow running tests

# Async support
asyncio_mode = auto

# Coverage options (when using --cov)
[coverage:run]
source = src
omit =
    */tests/*
    */migrations/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
